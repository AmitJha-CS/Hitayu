name: Setup React Node Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and setup React + Node.js structure
        shell: bash
        run: |
          set -e
          mkdir -p _tmp
          unzip -q hitayu-react-node-ecommerce.zip -d _tmp
          rm -rf hitayu.zip hitayu-ready-to-push.zip index.html package.json vite.config.js README.md src public
          shopt -s dotglob nullglob
          mv _tmp/hitayu-react-node/* .
          rm -rf _tmp hitayu-react-node-ecommerce.zip

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Setup clean React + Node.js structure"
          git push origin main
