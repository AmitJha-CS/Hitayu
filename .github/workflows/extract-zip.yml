name: Extract hitayu.zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and push
        run: |
          mkdir -p /tmp/extracted
          unzip -q hitayu.zip -d /tmp/extracted
          rm -rf /tmp/extracted/__MACOSX
          shopt -s dotglob nullglob
          entries=(/tmp/extracted/*)
          SRC="/tmp/extracted"
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            SRC="${entries[0]}"
          fi
          find "$SRC" -name ".git" -type d -prune -exec rm -rf {} +
          cp -a "$SRC"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract contents of hitayu.zip"
            git push origin main
          fi
